packages:
  - site
  - packages/*
allowBuilds:
  "@parcel/watcher": true
  # chromedriver is pulled in at CI time by `pnpm add -D -w @axe-core/cli` in the
  # accessibility job; pnpm 11 blocks its install script (secure-by-default) and
  # fails the step unless the build is explicitly decided here.
  chromedriver: true
  esbuild: true
  vue-demi: true

overrides:
  # nuxt 4.5.x (@nuxt/vite-builder) mandates the vite 8 (rolldown) line —
  # it imports transformWithOxc, which vite 7 does not export.
  vite: "^8.1.5"
  nuxt: "4.5.2"
  "@nuxt/kit": "4.5.2"
  ws: "^8.21.0"
  # Keep h3 on the 1.x line. Regenerating the lockfile under pnpm 11 let some
  # dev-only devtools grandchildren (@vitejs/devtools, devframe) float up to
  # versions requiring h3@2.x-rc, whose getRequestHost breaks the nitro
  # sitemap prerender. Baseline resolved only h3@1.15.11.
  "h3": "^1.15.11"
  # Force a single Vue runtime. nuxt 3.12.3 resolves vue 3.5.38 while the UI
  # libraries (radix-vue, pinia, @vueuse, @zag-js/vue, vue-router, ...) resolve
  # 3.5.39; two Vue copies ship in the client bundle and break component
  # instances at runtime ("Cannot read properties of null (reading 'refs')").
  # Pin the whole vue family to one version to dedupe. 3.5.39 -> 3.5.41
  # with the dependabot batch (2026-08-22); floor rises, dedupe stays.
  vue: "3.5.41"
  "@vue/shared": "3.5.41"
  "@vue/reactivity": "3.5.41"
  "@vue/runtime-core": "3.5.41"
  "@vue/runtime-dom": "3.5.41"
  "@vue/server-renderer": "3.5.41"
  "@vue/compiler-core": "3.5.41"
  "@vue/compiler-dom": "3.5.41"
  "@vue/compiler-sfc": "3.5.41"
  "@vue/compiler-ssr": "3.5.41"
  # Security: monaco-editor@0.55.1 pins dompurify to 3.2.7, which is flagged by
  # multiple GHSA advisories (mXSS / nesting-depth mutation issues). Bump the
  # transitive dep to the latest 3.4.x patch. 3.2.7 -> 3.4.13 is within the
  # 3.x line (stable DOMPurify.sanitize API), so monaco is unaffected.
  dompurify: "3.4.13"
  # Security (transitive dev/build-tooling deps flagged by Dependabot). All are
  # build-time only and never ship in the client bundle; forcing the patched
  # releases via overrides keeps the vulnerable versions out of the tree.
  shell-quote: "1.9.0" # GHSA critical: quote() fails to escape newlines in .op values
  tar: "7.5.21" # node-tar PAX size-override parser differential (file smuggling)
  launch-editor: "2.14.1" # NTLMv2 hash disclosure via UNC path handling (Windows)
  "@babel/core": "7.29.6" # arbitrary file read via sourceMappingURL comment
  # esbuild 0.25.12 is unaffected (below the advisory range); only bump the
  # vulnerable 0.27.x/0.28.0 copies so the safe copy is left untouched.
  "esbuild@>=0.27.3 <0.28.1": "0.28.1" # dev-server arbitrary file read (Windows)
  # Security (Dependabot 2026-08-22 batch): more transitive build/dev-time
  # deps flagged. Scoped ranges so safe copies already in the tree (nanoid
  # 5.x, js-yaml 5.x, postcss 8.5.23, ...) are left untouched.
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4" # ReDoS via cubic parse
  "brace-expansion@>=5.0.0 <5.0.8": "5.0.8" # ReDoS via cubic parse
  "postcss@<8.5.23": "8.5.23" # GHSA ReDoS in the comment tokenizer
  "fast-uri@<3.1.5": "3.1.5" # ReDoS via trailing-backslash input
  "js-yaml@<4.3.1": "4.3.1" # GHSA ReDoS in the load() parser
  "nanoid@>=3 <3.3.16": "3.3.18" # floor raised 3.3.16 -> 3.3.18 (PR #62)
  "nanoid@>=4.0.0 <5.1.16": "5.1.16" # GHSA predictable id from non-integer size
  "svgo@>=4.0.0 <4.0.2": "4.0.2" # GHSA XSS via badly chained transforms

peerDependencyRules:
  allowedVersions:
    eslint: "9 || 10"
